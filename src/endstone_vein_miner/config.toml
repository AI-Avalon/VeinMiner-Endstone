# Endstone用 VeinMiner 設定ファイル
# 鉱脈、木、葉を一度の破壊で一括破壊します

# 1回で破壊できる最大ブロック数 (-1で無制限ですが非推奨です)
max-blocks = 64

# ブロック処理のバッチサイズ (大きくすると速くなりますがサーバー負荷が増えます)
# 有効範囲: 1-100。推奨: 通常のサーバーは10、高性能なサーバーは20
batch-size = 10

# 一括破壊が発動する最小ブロック数 (1ブロックのみの破壊で発動するのを防ぎます)
min-vein-size = 2

# 一括破壊のクールダウン時間(ミリ秒) (スパム防止)
cooldown-ms = 100

[auto-pickup]
enabled = true
# インベントリが満杯の時の動作: \"drop\"(ドロップ) または \"delete\"(消去)
full-inventory-action = "drop"

# 採掘した鉱石を自動でインゴットに精錬する
[auto-smelt]
enabled = false
# 自動精錬を発動するためにツールに幸運エンチャントを必要とする
require-fortune = false
# 特定の鉱石のみ精錬する (空のリスト = 精錬可能な全鉱石)
# 形式: [\"coal_ore\", \"iron_ore\", \"gold_ore\", \"copper_ore\"]
whitelist = []
# 自動精錬時に精錬経験値を与える
give-xp = true
# 自動精錬の経験値倍率 (0.5 = 通常の精錬経験値の半分)
xp-multiplier = 0.5

[tool-durability]
# 耐久値の減少倍率 (1.0 = 通常, 2.0 = 2倍減少, 0.5 = 半分)
multiplier = 1.0
# 耐久力エンチャントの計算を適用する
respect-unbreaking = true
# 耐久値が限界を超える場合にツールを破壊する
break-on-exceed = true

[experience]
enabled = true
# 破壊したブロック数に基づく経験値ボーナス倍率
# 計算式: 基礎経験値 * (1 + (破壊数 / bonus-per-blocks) * multiplier)
# 例: 10ブロック破壊時 (bonus-per-blocks=5, multiplier=0.1) の場合、20%ボーナス (1.2倍の経験値)
bonus-enabled = true
bonus-per-blocks = 10  # 何ブロックごとにボーナスを与えるか
multiplier = 0.05  # 閾値ごとに5%のボーナス

# ワールド制限 (これらのワールドでは一括破壊を無効化)
disabled-worlds = ["creative_world", "spawn"]

[activation]
# 発動モード: \"sneak\"(スニーク時), \"stand\"(スニークしていない時), \"always\"(常に)
mode = "sneak"
# ブロック種類ごとに特定の権限を要求する (veinminer.blocks.coal_ore など)
per-block-permissions = false
# 適切なツールを使用した場合のみ発動する (鉱石にはツルハシ、木には斧など)
require-correct-tool = true
# プレイヤーから破壊対象ブロックまでの最大距離
max-reach-distance = 100

# 一括破壊の検知パターン・形状
[mining-pattern]
# パターンタイプ:
#   \"adjacent\" - 隣接ブロックのみ (従来の一括破壊の動作)
#   \"cube\" - 各ブロックの周囲の3Dキューブ
#   \"sphere\" - 各ブロックの周囲の球状範囲
#   \"vertical\" - 垂直方向の列 (木の幹に便利)
#   \"horizontal\" - 水平面 (鉱石の層に便利)
pattern = "adjacent"
# 球状/キューブパターンの半径 (ブロック数、adjacentでは無視されます)
radius = 1
# 斜めのブロックを含める (adjacentモード用)
# falseの場合、6面(上下前後左右)のみを含めます
# trueの場合、周囲26ブロックすべてを含めます
include-diagonals = true
# verticalパターンの場合: 検索する最大の高さ
vertical-range = 4
# horizontalパターンの場合: 検索する最大の幅
horizontal-range = 4

# 独立したチェーン採掘 (破壊したブロックから方向性のある直方体) 大規模サーバーには非推奨です！
[chain-mining]
enabled = false
# Activation mode: "sneak" (hold shift), "stand" (not sneaking), "always"
mode = "stand"
# 適切なツールを使用した場合のみ発動する (鉱石にはツルハシ、木には斧など)
require-correct-tool = true
# ブロック種類ごとに特定のチェーン採掘権限を要求する (veinminer.chain.blocks.coal_ore など)
per-block-permissions = false
# チェーン採掘を設定された一括破壊対象ブロックのみに制限する
only-configured-blocks = false
# 断面の幅の半径 (1 = 幅3ブロック)
width-radius = 1
# 断面の高さの半径 (1 = 高さ3ブロック)
height-radius = 1
# 破壊したブロックからの深さ (中心層を含みます; 3 = 深さ3層)
depth = 3
# チェーン採掘で処理する最大ブロック数
max-blocks = 256
# trueの場合、最初に破壊したブロックと同じ種類のブロックのみ採掘する
same-block-only = false

# パーティクルのカスタマイズ
[effects.particles]
# ブロック破壊時のパーティクルエフェクトを有効にする
enabled = true
# パーティクルの種類: \"explosion\", \"flame\", \"smoke\", \"sparkle\", \"heart\", \"critical\"
type = "explosion"
# ブロックごとのパーティクル数
count = 3
# パーティクルの発生半径
radius = 0.5
# すべてのブロックでパーティクルを表示する (false = 完了時のみ)
per-block = false

# サウンドのカスタマイズ
[effects.sounds]
# サウンドエフェクトを有効にする
enabled = true
# 完了時に再生するサウンド (例: \"random.levelup\")
completion-sound = "random.levelup"
# 音量 (0.0 - 1.0)
volume = 1.0
# ピッチ (0.5 - 2.0, 高いほど高音)
pitch = 1.0
# 壊れたブロックごとに音を鳴らす (大量破壊時はうるさくなる可能性があります)
per-block-sound = false
# ブロックごとに再生するサウンド (per-block-soundがtrueの場合)
block-sound = "dig.stone"

[limits]
# 悪用を防ぐための1日/セッションごとの制限
enable-limits = false
max-veins-per-day = 1000
max-blocks-per-day = 10000
reset-time = "00:00"  # 将来のアップデート用 (現在のリセットは24時間固定スケジュールです)

# 悪用防止(Anti-Abuse)設定
[anti-abuse]
# 1分あたりの最大一括破壊回数 (0 = 無効)
max-veins-per-minute = 60
# 制限を超えたプレイヤーをX分間ブロックする
temporary-block-duration = 5
# 疑わしい活動（過度な一括破壊）をログに記録する
log-suspicious-activity = true

[statistics]
enabled = true
storage = "yaml"  # \"yaml\" または \"mysql\"
save-to-file = true  # 統計をstats.ymlに保存する
auto-save-interval = 300  # 自動保存の同隔(秒) (0 = 統計更新ごとに保存)
track-per-block-type = true  # 将来のブロックごとの統計内訳用
milestones = { enabled = true, thresholds = [100, 500, 1000, 5000, 10000] }
# すべてのプレイヤーにマイルストーンをアナウンスする
broadcast-milestones = true

[statistics.mysql]
# 以下のいずれかの方法でMySQLを有効にできます:
#   1) statistics.storage = \"mysql\" を設定する
#   2) この enabled フラグを true にする
enabled = false
host = "127.0.0.1"
port = 3306
database = "veinminer"
user = "root"
password = "change_me"
table-prefix = "veinminer_"
connect-timeout = 5

[update-checker]
enabled = true
repository = "EuphoriaDevelopmentOrg/VeinMiner-Endstone"

[logging]
enabled = true
log-vein-mining = true
log-config-loading = true
debug-logging = false  # 詳細なデバッグログを有効にする (コンソールが大量に流れます)
performance-logging = false  # パフォーマンス指標（検索/処理時間）をログに記録する
log-player-toggle = false  # プレイヤーが一括破壊を切り替えた時にログに記録する
log-cooldown-violations = false  # プレイヤーがクールダウンに引っかかった時にログに記録する
log-errors-to-file = true  # エラーを個別のエラーログファイルに保存する

[enabled-blocks]
ores = true
logs = true
leaves = true

[messages]
reload-success = "&aConfiguration reloaded successfully!"
stats-header = "&6&l=== Your VeinMiner Statistics ==="
stats-line = "&eTotal Veins: &f{veins} &7| &eTotal Blocks: &f{blocks} &7| &eLargest Vein: &f{largest}"
toggle-enabled = "&aVein Mining enabled!"
toggle-disabled = "&cVein Mining disabled!"
inventory-full = "&eInventory full! {count} items were {action}."
vein-too-large = "&cVein size limited to {max} blocks!"
cooldown-active = "&cPlease wait before vein mining again!"
wrong-tool = "&cYou need the correct tool to vein mine this block!"
no-permission = "&cYou don't have permission to vein mine this block type!"
limit-reached = "&cYou've reached your daily vein mining limit!"
milestone-reached = "&6&l{player} &ehas mined &6{count} &eblocks with VeinMiner!"
chain-toggle-enabled = "&aChain Mining enabled!"
chain-toggle-disabled = "&cChain Mining disabled!"

